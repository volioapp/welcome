<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Volio — Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #050e1e;
      --blue:    #1d419f;
      --white:   #ffffff;
      --muted:   #888888;
      --border:  #e8e8e8;
      --gray-bg: #f4f5f7;
      --bar-h:   clamp(60px, 8svh, 72px);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--white);
      color: var(--navy);
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
    }

    /* ── SLIDER ──────────────────────────────── */
    #slider {
      display: flex;
      width: 100%;
      height: 100%;
      will-change: transform;
      transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slide {
      min-width: 100vw;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── SLIDE 1 · WELCOME ───────────────────── */
    .slide-welcome {
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3.5svh, 28px);
      padding-bottom: clamp(60px, 9svh, 80px);
      padding-left: clamp(20px, 6vw, 40px);
      padding-right: clamp(20px, 6vw, 40px);
    }

    .welcome-logo {
      width: clamp(68px, 18vw, 96px);
      height: clamp(68px, 18vw, 96px);
      border-radius: clamp(16px, 4vw, 24px);
      display: block;
    }

    .welcome-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(30px, 8.5vw, 48px);
      letter-spacing: -0.3px;
      color: var(--navy);
      text-align: center;
    }

    .welcome-sub {
      font-size: clamp(13px, 3.5vw, 16px);
      font-weight: 400;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      max-width: 240px;
    }

    /* ── VIDEO SLIDE ─────────────────────────── */
    .slide-video {
      background: #000;
      justify-content: flex-start;
    }

    .slide-video video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-scrim {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 42%;
      background: linear-gradient(180deg,
                  rgba(5,14,30,0.82) 0%,
                  rgba(5,14,30,0.55) 45%,
                  rgba(5,14,30,0) 100%);
      pointer-events: none;
    }

    .video-copy {
      position: relative;
      z-index: 2;
      padding: calc(env(safe-area-inset-top, 0px) + clamp(28px, 6svh, 56px))
               clamp(22px, 7vw, 40px) 0;
      max-width: 92%;
    }

    .video-tag {
      display: block;
      font-size: clamp(8px, 2.2vw, 10px);
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: clamp(6px, 1.2svh, 10px);
    }

    .video-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(28px, 8vw, 44px);
      line-height: 1;
      letter-spacing: -0.3px;
      color: var(--white);
      text-shadow: 0 2px 18px rgba(0,0,0,0.35);
    }

    /* ── SCREENSHOT SLIDES ───────────────────── */
    .slide-img {
      width: 100%;
      height: clamp(240px, 70svh, 74svh);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background: var(--gray-bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: clamp(6px, 1.5svh, 14px);
    }

    /* soft fade where the mockup runs past the bottom of the area */
    .slide-img::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: clamp(40px, 8svh, 70px);
      background: linear-gradient(180deg, rgba(244,245,247,0) 0%, var(--gray-bg) 82%);
      pointer-events: none;
    }

    .slide-img img {
      width: min(92%, 420px);
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,0.10));
    }

    .slide-text {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(10px, 2svh, 18px) clamp(20px, 6vw, 32px) clamp(66px, 8.5svh, 80px);
      overflow: hidden;
    }

    .step-ghost {
      position: absolute;
      right: -4px;
      bottom: clamp(36px, 6svh, 52px);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(62px, 20vw, 100px);
      line-height: 1;
      letter-spacing: -4px;
      color: rgba(29, 65, 159, 0.055);
      pointer-events: none;
      user-select: none;
    }

    .slide-tag {
      font-size: clamp(8px, 2.2vw, 10px);
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: clamp(4px, 1svh, 8px);
    }

    .slide-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(26px, 7.5vw, 40px);
      line-height: 1;
      letter-spacing: -0.3px;
      color: var(--navy);
    }

    .slide-desc {
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 400;
      line-height: 1.7;
      color: var(--muted);
      max-width: 90%;
      margin-top: clamp(8px, 1.5svh, 14px);
    }

    /* ── REVERSED SLIDE (text on top, mockup below) ── */
    .slide-reverse .slide-text {
      flex: 0 0 auto;
      justify-content: flex-end;
      padding: calc(env(safe-area-inset-top, 0px) + clamp(26px, 5svh, 48px))
               clamp(20px, 6vw, 32px) clamp(12px, 2.5svh, 22px);
    }

    .slide-reverse .step-ghost {
      bottom: auto;
      top: calc(env(safe-area-inset-top, 0px) + clamp(10px, 2svh, 24px));
    }

    .slide-reverse .slide-img {
      flex: 1 1 auto;
      height: auto;
      min-height: 0;
      align-items: flex-start;
      padding-top: 0;
    }

    /* ── BOTTOM BAR ──────────────────────────── */
    #bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--bar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 5vw, 28px);
      background: var(--white);
      border-top: 1px solid var(--border);
      z-index: 300;
      transition: background 0.35s, border-color 0.35s;
    }

    /* dark variant when the active slide is a video slide */
    #bottom-bar.on-dark {
      background: rgba(5,14,30,0.55);
      border-top-color: rgba(255,255,255,0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #dots {
      display: flex;
      gap: clamp(5px, 1.5vw, 8px);
      align-items: center;
    }

    .dot {
      height: 5px;
      width: 5px;
      border-radius: 50px;
      background: rgba(5,14,30,0.14);
      transition: all 0.32s cubic-bezier(0.4,0,0.2,1);
    }

    .dot.active {
      background: var(--navy);
      width: clamp(18px, 5vw, 22px);
      border-radius: 3px;
    }

    #bottom-bar.on-dark .dot        { background: rgba(255,255,255,0.28); }
    #bottom-bar.on-dark .dot.active { background: var(--white); }

    .nav-arrow {
      width: clamp(38px, 10vw, 44px);
      height: clamp(38px, 10vw, 44px);
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.25s, transform 0.15s, background 0.35s, border-color 0.35s;
    }

    .nav-arrow:active { transform: scale(0.88); }

    #next-btn { background: var(--navy); border-color: var(--navy); }
    #next-btn svg { stroke: #fff; margin-left: 1px; }
    #back-btn svg { stroke: var(--navy); margin-right: 1px; }

    #bottom-bar.on-dark #next-btn      { background: var(--white); border-color: var(--white); }
    #bottom-bar.on-dark #next-btn svg  { stroke: var(--navy); }
    #bottom-bar.on-dark #back-btn      { background: transparent; border-color: rgba(255,255,255,0.35); }
    #bottom-bar.on-dark #back-btn svg  { stroke: #fff; }

    .nav-arrow.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

<!-- ── BOTTOM BAR ───────────────────────────── -->
<div id="bottom-bar">
  <button class="nav-arrow hidden" id="back-btn" onclick="prev()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <div id="dots"></div>

  <button class="nav-arrow" id="next-btn" onclick="next()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>
</div>

<!-- ══════════════════════════════════════════
     SLIDER
══════════════════════════════════════════ -->
<div id="slider">

  <!-- SLIDE 0 · WELCOME -->
  <div class="slide slide-welcome">
    <img src="logo.png" class="welcome-logo" alt="Volio" />
    <h1 class="welcome-title">Welcome volier!</h1>
    <p class="welcome-sub">The social network for the aviation world.</p>
  </div>

  <!-- SLIDE 1 · UPLOAD VIDEO -->
  <div class="slide slide-video" data-dark="1">
    <video src="volio_upload.mp4"
           muted loop playsinline webkit-playsinline preload="auto"></video>
    <div class="video-scrim"></div>
    <div class="video-copy">
      <span class="video-tag">Step 01</span>
      <h2 class="video-title">HOW TO UPLOAD<br/>YOUR FIRST FLIGHT</h2>
    </div>
  </div>

  <!-- SLIDE 2 · PROFILE -->
  <div class="slide">
    <div class="slide-img">
      <img src="profile.png" alt="Profile" />
    </div>
    <div class="slide-text">
      <span class="step-ghost">02</span>
      <span class="slide-tag">Profile</span>
      <h2 class="slide-title">PERSONALISE<br/>YOUR PROFILE</h2>
      <p class="slide-desc">Add your organisation and reference airport.</p>
    </div>
  </div>

  <!-- SLIDE 3 · SEARCH -->
  <div class="slide slide-reverse">
    <div class="slide-text">
      <span class="step-ghost">03</span>
      <span class="slide-tag">Search</span>
      <h2 class="slide-title">SEARCH FOR YOUR<br/>FRIENDS AND COLLEAGUES</h2>
    </div>
    <div class="slide-img">
      <img src="users.png" alt="Search for users" />
    </div>
  </div>

</div><!-- /slider -->

<script>
  const slider  = document.getElementById('slider');
  const slides  = Array.from(slider.querySelectorAll('.slide'));
  const TOTAL   = slides.length;
  const dotsEl  = document.getElementById('dots');
  const bar     = document.getElementById('bottom-bar');
  const backBtn = document.getElementById('back-btn');
  const nextBtn = document.getElementById('next-btn');

  let current = 0;
  let startX = 0, startY = 0, isDragging = false, dragDelta = 0, isH = null;

  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    dotsEl.appendChild(d);
  }

  function syncVideos() {
    slides.forEach((s, i) => {
      const v = s.querySelector('video');
      if (!v) return;
      if (i === current) { v.currentTime = 0; v.play().catch(() => {}); }
      else               { v.pause(); }
    });
  }

  function updateUI() {
    document.querySelectorAll('.dot').forEach((d, i) =>
      d.classList.toggle('active', i === current));
    backBtn.classList.toggle('hidden', current === 0);
    nextBtn.classList.toggle('hidden', current === TOTAL - 1);
    bar.classList.toggle('on-dark', slides[current].dataset.dark === '1');
    syncVideos();
  }

  function goTo(n) {
    const target = Math.max(0, Math.min(TOTAL - 1, n));
    const changed = target !== current;
    current = target;
    slider.style.transition = 'transform 0.42s cubic-bezier(0.4,0,0.2,1)';
    slider.style.transform  = `translateX(-${current * 100}vw)`;
    if (changed) updateUI(); else bar.classList.toggle('on-dark', slides[current].dataset.dark === '1');
  }

  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  slider.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isDragging = true; isH = null;
    slider.style.transition = 'none';
  }, { passive: true });

  slider.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (isH === null) isH = Math.abs(dx) > Math.abs(dy);
    if (!isH) return;
    dragDelta = dx;
    slider.style.transform = `translateX(${-(current * window.innerWidth) + dx}px)`;
  }, { passive: true });

  slider.addEventListener('touchend', () => {
    isDragging = false;
    if (isH) {
      const t = window.innerWidth * 0.22;
      if      (dragDelta < -t) goTo(current + 1);
      else if (dragDelta >  t) goTo(current - 1);
      else                      goTo(current);
    } else { goTo(current); }
    dragDelta = 0; isH = null;
  });

  updateUI();
</script>
</body>
</html>
